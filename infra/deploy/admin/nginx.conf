server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's embedded DNS, for the asset fallback's upstream name.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 2s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build output never changes under the same name. This image holds
    # this release's assets plus the previous release's (see Containerfile).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @asset_fallback;
    }

    # Still missing: during a rolling deploy this may be the old container,
    # asked for an asset of the release that is replacing it. Ask the public
    # site again; the proxy balances across both containers, so the retry
    # reaches the new one. The header stops a second hop.
    location @asset_fallback {
        if ($http_x_jevidocs_admin_asset_fallback) {
            return 404;
        }
        set $site https://admin.jevidocs.jevido.app;
        proxy_pass $site$request_uri;
        proxy_set_header Host admin.jevidocs.jevido.app;
        proxy_set_header X-Jevidocs-Admin-Asset-Fallback 1;
        proxy_ssl_server_name on;
        proxy_ssl_name admin.jevidocs.jevido.app;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        error_page 502 503 504 = @asset_missing;
    }

    location @asset_missing {
        return 404;
    }

    location = /_assets.txt {
        add_header Cache-Control "no-cache";
        default_type text/plain;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's embedded DNS, for the asset fallback's upstream name.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 2s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build output never changes under the same name. This image holds
    # this release's assets plus the previous release's (see Containerfile).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @asset_fallback;
    }

    # Still missing: during a rolling deploy this may be the old container,
    # asked for an asset of the release that is replacing it. Ask the public
    # site again; the proxy balances across both containers, so the retry
    # reaches the new one. The header stops a second hop.
    location @asset_fallback {
        if ($http_x_jevidocs_asset_fallback) {
            return 404;
        }
        set $site https://jevidocs.jevido.app;
        proxy_pass $site$request_uri;
        proxy_set_header Host jevidocs.jevido.app;
        proxy_set_header X-Jevidocs-Asset-Fallback 1;
        proxy_ssl_server_name on;
        proxy_ssl_name jevidocs.jevido.app;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        error_page 502 503 504 = @asset_missing;
    }

    location @asset_missing {
        return 404;
    }

    location = /_assets.txt {
        add_header Cache-Control "no-cache";
        default_type text/plain;
    }

    # fumadocs-style Markdown and llms.txt addresses, answered by the API.
    location = /llms.txt {
        return 302 https://api.jevidocs.jevido.app/api/projects/jevidocs/llms.txt;
    }
    location = /llms-full.txt {
        return 302 https://api.jevidocs.jevido.app/api/projects/jevidocs/llms-full.txt;
    }
    location ~ ^/docs/(.*)\.md$ {
        return 302 https://api.jevidocs.jevido.app/api/projects/jevidocs/page.md?slug=$1;
    }
    location = /docs.md {
        return 302 https://api.jevidocs.jevido.app/api/projects/jevidocs/page.md?slug=;
    }

    # The docs reader: one single-page entry per prefix. HTML always
    # revalidates, so a browser never keeps a page pointing at assets from a
    # release long gone.
    location /docs {
        add_header Cache-Control "no-cache";
        try_files $uri /docs/index.html;
    }
    location /p/ {
        add_header Cache-Control "no-cache";
        try_files $uri /p/index.html;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}
